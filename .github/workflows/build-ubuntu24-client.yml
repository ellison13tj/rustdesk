name: Build Ubuntu 24.04 Client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'libs/**/*.toml'
      - 'src/**/*.rs'
      - '.github/workflows/build-ubuntu24-client.yml'

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  RUST_VERSION: "1.75"  # 使用稳定版本
  VERSION: "1.4.6"

jobs:
  build-ubuntu24-client:
    name: Ubuntu 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            libpam0g-dev \
            libasound2-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libvdpau-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            wget

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "15.0.6"

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2

      - name: Build RustDesk client
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --target=x86_64-unknown-linux-gnu --release --bin rustdesk
        env:
          RENDEZVOUS_SERVERS: ${{ secrets.RENDEZVOUS_SERVERS }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

      - name: Package build artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/rustdesk artifacts/

          # Create tarball
          tar -czf artifacts/rustdesk-ubuntu24-x86_64.tar.gz -C artifacts rustdesk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ubuntu24-x86_64
          path: artifacts/
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/rustdesk-ubuntu24-x86_64.tar.gz
          tag_name: v${{ env.VERSION }}-ubuntu24.04
          name: RustDesk Client for Ubuntu 24.04
          body: |
            Auto-built RustDesk client for Ubuntu 24.04 (x86_64)
            - Built on: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Build time: ${{ github.run_id }}

            ## Installation
            ```bash
            tar -xzf rustdesk-ubuntu24-x86_64.tar.gz
            ./rustdesk
            ```

            ## Dependencies
            Ensure you have the following dependencies installed:
            - GTK 3
            - PulseAudio
            - GStreamer
            - X11 libraries

            ## Notes
            This is an auto-built release from GitHub Actions.