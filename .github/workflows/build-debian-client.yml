name: Build Debian 24.04 Client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'libs/**/*.toml'
      - 'src/**/*.rs'
      - '.github/workflows/build-debian-client.yml'

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-debian-client:
    name: Debian 24.04 (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            g++ \
            libpam0g-dev \
            libasound2-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libvdpau-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            nasm \
            wget

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
          components: ''

      - name: Show version information
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build RustDesk client
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --locked --target=x86_64-unknown-linux-gnu --release
        env:
          RENDEZVOUS_SERVERS: ${{ secrets.RENDEZVOUS_SERVERS }}
          RS_PUB_KEY: ${{ secrets.RS_PUB_KEY }}

      - name: Package build artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/x86_64-unknown-linux-gnu/release/rustdesk artifacts/
          cp target/x86_64-unknown-linux-gnu/release/rustdesk-server artifacts/
          cp target/x86_64-unknown-linux-gnu/release/service artifacts/
          cp target/x86_64-unknown-linux-gnu/release/naming artifacts/

          # Create tarball
          tar -czf artifacts/rustdesk-debian-x86_64.tar.gz -C artifacts rustdesk rustdesk-server service naming

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-debian-x86_64
          path: artifacts/
          retention-days: 7

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --target=x86_64-unknown-linux-gnu --workspace --no-fail-fast -- --skip test_get_cursor_pos --skip test_get_key_state